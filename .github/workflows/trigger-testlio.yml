name: Trigger iOS Automation Tests

on:
  push:
    branches: [ master, develop, uitests-testlio ]

jobs:
  trigger-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Debug trigger
        run: echo "Triggered from ${{ github.ref_name }} - commit ${{ github.sha }}"

      - name: Trigger Test Repo Workflow
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: token ${{ secrets.TEST_REPO_PAT }}" \
          https://api.github.com/repos/Testlio-Automation/Bitpay-XcuiTest-Automation/dispatches \
          -d '{
                "event_type": "client-updated",
                "client_sha": "${{ github.sha }}",
                "branch": "${{ github.ref_name }}"
              }'
